# ══════════════════════════════════════════════════════════════════════
# Docker Compose — Chatwoot · Clube TCL SEMP 2026
# Stack: Rails + Sidekiq + PostgreSQL 15 + Redis 7
# ══════════════════════════════════════════════════════════════════════

version: "3.8"

services:
  # ── Rails (API + Dashboard + Widget) ──────────────────────────────
  rails:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot-rails
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-public:/app/public
      - ./brand-assets:/app/public/brand-assets:ro
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      - chatwoot-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/auth/sign_in || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Sidekiq (Background Jobs) ─────────────────────────────────────
  sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot-sidekiq
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
    volumes:
      - chatwoot-storage:/app/storage
      - chatwoot-public:/app/public
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    networks:
      - chatwoot-net

  # ── PostgreSQL 15 ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: chatwoot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - chatwoot-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - chatwoot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chatwoot-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - chatwoot-redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - chatwoot-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Volumes ───────────────────────────────────────────────────────────
volumes:
  chatwoot-pgdata:
    driver: local
  chatwoot-redis:
    driver: local
  chatwoot-storage:
    driver: local
  chatwoot-public:
    driver: local

# ── Network ───────────────────────────────────────────────────────────
networks:
  chatwoot-net:
    driver: bridge
