# ══════════════════════════════════════════════════════════════════════
# Nginx — Chatwoot Reverse Proxy · Clube TCL SEMP 2026
# Domínio: bko.ybyagencia.com.br
# SSL: Let's Encrypt (Certbot)
# ══════════════════════════════════════════════════════════════════════

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=chatwoot_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=chatwoot_widget:10m rate=60r/s;

# Upstream
upstream chatwoot_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name bko.ybyagencia.com.br;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bko.ybyagencia.com.br;

    # ── SSL ──────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/bko.ybyagencia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bko.ybyagencia.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/bko.ybyagencia.com.br/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # ── Security Headers ─────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # ── Gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml;

    # ── Limites ──────────────────────────────────────────────────────
    client_max_body_size 40M;
    client_body_timeout 60s;
    proxy_read_timeout 120s;
    proxy_send_timeout 60s;

    # ── Logs ─────────────────────────────────────────────────────────
    access_log /var/log/nginx/chatwoot_access.log;
    error_log /var/log/nginx/chatwoot_error.log;

    # ── Proxy defaults ───────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # ── WebSocket — ActionCable ──────────────────────────────────────
    location /cable {
        proxy_pass http://chatwoot_backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Widget SDK (higher rate limit) ───────────────────────────────
    location /packs/js/sdk {
        limit_req zone=chatwoot_widget burst=30 nodelay;
        proxy_pass http://chatwoot_backend;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── API (rate limited) ───────────────────────────────────────────
    location /api/ {
        limit_req zone=chatwoot_api burst=20 nodelay;
        proxy_pass http://chatwoot_backend;
    }

    # ── Static assets ────────────────────────────────────────────────
    location /packs/ {
        proxy_pass http://chatwoot_backend;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /brand-assets/ {
        proxy_pass http://chatwoot_backend;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Health check ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://chatwoot_backend;
        access_log off;
    }

    # ── Default ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://chatwoot_backend;
    }
}
